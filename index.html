<!DOCTYPE html>
<head>
    <title>adam's weather</title>
<style>
    *{
        box-sizing: border-box;
    }

    body {
        font-family: Arial;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        color:black
    }

    h1, h2 {
        margin-bottom: 12px;
    }

    form {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }
        input, button {
            font:inherit;
            padding: 10px;
        }

        input, button {
            font: inherit;
            padding: 10px;
        }

        input{
            flex: 1;
            min-width: 0;
        }

        button{
            cursor: pointer;
        }

        .current, .section {
            border: 1px solid #ddd;
            padding: 16px;
            margin-bottom: 16px;
        }

        #temperature {
            font-size: 48px;
            margin: 10px 0;
        }

        .details {
            display:flex;
            flex-wrap:wrap;
            gap: 20px;
        }

        .forecast{
            display: flex;
            gap: 12px;
            overflow-x: auto;
        }

        .hour, .day {
            min-width: 90px;
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .hour p, .day p {
            margin: 8px 0;
        }
        
        #status {
            margin-bottom: 16px;
        }

        .places button {
            margin: 0 8px 8px 0;
            padding: 6px 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
        form{
            flex-wrap: wrap;
        }

        input {
            flex-basis: 100%
        }
    }
</style>
</head>
<body>
    <h1>Weather App</h1>

    <form id="searchForm">
        <input
            id="cityInput"
            type="text"
            placeholder ="What city do you want to view"
            value ="Jersey City"
            required
        >
    <button type="submit">Search</button>
    <button type="button" id="unitButton">°F / °C</button>
        <button type="button"
    id="favoriteButton">Add favorite</button>
    </form>

        <section class="section">
            <h2>Favorites</h2>
            <div class="places" id="favorites"></div>
            <h2>Recent</h2>
            <div class="places" id="recent"></div>
        </section>
    <p id="status">loading</p>

    <main id="weather" hidden>
        <section class="current">
   
            <h2 id="cityName"></h2>
            <p id="condition"></p>
            <p class="temperature"id="temperature"></p> 
            <div class="details">
            <p id="feelsLike"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
        </div>
            <p id="highLow"></p>
        </section>

        <section class="section">
            <h2>Hour Forecast</h2>
            <div class="forecast" id="hourly"></div>
        </section>

        <section class="section">
            <h2>7-Day Forecast</h2>
            <div id="daily"></div>
        </section>
    </main>

<script>

        const $ = id =>
    document.getElementById(id);

        let unit = "fahrenheit";
        let currentPlace = null;

        const conditions = {
            0: "Clear Sky",
            1: "Mainly clear",
            2: "Partly cloudy",
            3: "Overcast",
            45: "Fog",
            48: "Rime fog",
            51: "Light drizzle",
            53: "Drizzle",
            55: "Heavy drizzle",
            56: "Freezing drizzle",
            57: "Freezing drizzle",
            61: "Light rain",
            63: "Rain",
            65: "Heavy rain",
            66: "Freezing rain",
            67: "Freezing rain",
            71: "Light snow",
            73: "Snow",
            75: "Heavy snow",
            77: "Snow grains",
            80: "Rain showers",
            81: "Rain showers",
            82: "Heavy rain showers",
            85: "Snow showers",
            86: "Heavy snow showers",
            95: "Thunderstorm",
            96: "Thunderstorm with hail",
            99: "Severe thunderstorm"
        };

        function getCondition(code) {
            return conditions[code] || "Unknown conditions";
        }

        function temperature(value) {
        return `${Math.round(value)}°${unit === "fahrenheit" ? "F" : "C"}`;
        }

        function timeLabel(value) {
            return new 
        Date(value).toLocaleTimeString([],{hour: "numeric"

        });
        }

        function dateLabel(value) {
            return new Date(value + "T12:00:00").toLocaleDateString([], {
                weekday: "short",
                month: "short",
                day: "numeric"
            })
        }
    async function searchCity(name) {
        const response = await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?" +
        new URLSearchParams({
            name,
            count: 1,
            language: "en",
            format: "json"
        })
    );

    if(!response.ok) {
        throw new Error("Could not search for this city");
    }

    const data = await response.json();

    if (!data.results|| data.results.length === 0) {
        throw new Error("City not found.");
    }
        return data.results[0];
    }

    async function getWeather(place) {
        const params = new URLSearchParams({
            latitude: place.latitude,
            longitude: place.longitude,
            timezone: "auto",
            temperature_unit: unit,
            wind_speed_unit: unit === "fahrenheit" ? "mph" : "kmh",
            current: [
                "temperature_2m",
                "apparent_temperature",
                "relative_humidity_2m",
                "weather_code",
                "wind_speed_10m"
                ].join(","),
                hourly: [
                    "temperature_2m",
                    "weather_code"
                ].join(","),
                daily: [
                    "weather_code",
                    "temperature_2m_max",
                    "temperature_2m_min"
                ].join(","),
                forecast_days: 7
        });

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
            throw new Error("Could not retrieve weather data.");
        }

        const data = await response.json();

        if (!data.current || !data.hourly || !data.daily) {
            throw new Error("Weather data is unavailable.");
        }

        return data;
    }

    function renderWeather(place, data) {
        const current = data.current;

        const daily = data.daily;

        $("cityName").textContent = [
            place.name,
            place.admin1,
            place.country
        ].filter(Boolean).join(", ");
        
        $("condition").textContent =
        getCondition(current.weather_code);
        $("temperature").textContent =

    temperature (current.temperature_2m);

        $("feelsLike").textContent =
        "Feels like: " +
    temperature(current.apparent_temperature);
        $("humidity").textContent =
        "Humidity: " + current.relative_humidity_2m + "%";
        $("wind").textContent =
        "Wind: " +
    Math.round(current.wind_speed_10m) +
        (unit === "fahrenheit" ? " mph" : " km/h");

        $("highLow").textContent =
        "High: " +
    temperature(daily.temperature_2m_max[0]) +
        " | Low: " +
    temperature(daily.temperature_2m_min[0]);

        renderHourly(data.hourly,current.time);

        renderDaily(daily);

        $("weather").hidden = false;
        $("status").textContent = "";
    }

        function renderHourly(hourly, currentTime) {
            const container = $("hourly");
            container.replaceChildren();

            let start = hourly.time.findIndex(
                time => time.slice(0,13) === currentTime.slice(0,13)
            );

            if (start < 0) start = 0;
            hourly.time.slice(start, start + 24).forEach((time,index) => {
                const i = start + index;
                const card =
            document. createElement("div");
                card.className = "hour";

                const hour =
            document.createElement("p");
                hour.textContent = index === 0 ?
            "Now" : timeLabel(time);

                const condition =
            document.createElement("p");
                condition.textContent =
            getCondition(hourly.weather_code[i]);

                const temp =
            document.createElement("p");
                temp.textContent =
            temperature(hourly.temperature_2m[i]);

                card.append(hour, condition, temp);
                container.append(card);
            });
        }

        function renderDaily(daily) {
            const container = $("daily");
            container.replaceChildren();
            
            daily.time.forEach((date, index) => {
                const card =
            document.createElement("div");
                card.className = "day";

                const name = document.createElement("p");
                name.textContent = index === 0 ?
                "Today" : dateLabel(date);

                const condition = document.createElement ("p");
                condition.textContent = getCondition(daily.weather_code[index]);

                const low = document.createElement("p");
                low.textContent = "Low: " +
                temperature(daily.temperature_2m_min[index]);

                const high = document.createElement("p");
                    high.textContent = "High: " +

                temperature(daily.temperature_2m_max[index]);

                    card.append(name, condition, low, high);
                    container.append(card);
            });
      }
        
        async function loadWeather(name) {
            $("status").textContent = "Loading weather...";
            $("weather").hidden = true;
            try {
                const place = await
            searchCity(name);
                const data = await
            getWeather(place);

                currentPlace = place;
                renderWeather(place,data);
            } catch (error) {
                $("status").textContent =
                    error.message || "Something went wrong.";
            }
        }

        $("searchForm").addEventListener("submit",event => {
            event.preventDefault();
            const city =
        $("cityInput").value.trim();
            if (city) loadWeather(city);
    });

    $("unitButton").addEventListener("click", async () => {
        unit = unit === "fahrenheit" ?
        "celsius" : "fahrenheit";

        if (currentPlace) {
            $("status").textContent = "Updating units...";
            $("weather").hidden = true;

            try {
                const data = await
            getWeather(currentPlace);
                renderWeather(currentPlace, data);
                } catch (error) {
                $("status").textContent = error.message;
            }
        }

        $("unitButton").textContent =
        unit === "fahrenheit" ? "°F / °C" : "°C / °F";

        });

        loadWeather("Jersey City");
    </script>
    </body>
    </html>
