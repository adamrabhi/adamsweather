<!DOCTYPE html>
<head>
    <title>adam's weather</title>
<style>
    *{
        box-sizing: border-box;
    }

    body {
        font-family: Arial;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        color:black
    }

    form {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }
        input, button {
            font:inherit;
            padding: 10px;
        }

        input, button {
            font: inherit;
            padding: 10px;
        }

        input{
            flex: 1;
            min-width: 0;
        }

        button{
            cursor: pointer;
        }

        section {
            border: 1px solid #ddd;
            padding: 16px;
            margin-bottom: 16px;
        }

        #temperature {
            font-size: 48px;
        }

        #hourly {
            display: flex;
            gap: 12px;
            overflow-x: auto;
        }
        #hourly > div,
        #daily > div {
            min-width:100px;
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
        form{
            flex-wrap: wrap;
        }

        input {
            flex-basis: 100%
        }
    }
</style>
</head>
<body>
    <h1>Weather App</h1>

    <form id="searchForm">
        <input
            id="cityInput"
            type="text"
            placeholder ="what city do you want to view"
            value ="New York"
            required
        >
    <button type="submit">Search</button>
    <button type="button" id="unitButton">°F / °C</button>
    </form>

    <p id="status">loading</p>

    <main id="weather" hidden>

        <section>
            <h2 id="cityName"></h2>
            <p id="condition"></p>
            <p id="temperature"></p> 
            <p id="feelsLike"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
            <p id="highLow"></p>
        </section>

        <section>
            <h2>Hour Forecast</h2>
            <div id="hourly"></div>
        </section>

        <section>
            <h2>7-Day Forecast</h2>
            <div id="daily"></div>
        </section>
    </main>

<script>
    async function searchCity(name) {
        const response = await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?" +
        new URLSearchParams({
            name: name,
            count: 1,
            language: "en",
            format: "json"
        })
    );

    if(!response.ok) {
        throw new Error("Could not search for this city")
    }

    const data = await response.json();

    if (!data.results|| data.results.length === 0) {
        throw new Error("City not found.")
    }
        return data.results[0]
    }

    async function getWeather(place) {
        const params = new URLSearchParams({
            latitude: place.latitude,
            longitude: place.longitude,
            timezone: "auto",
            temperature_unit: unit,
            current:
        "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
            hourly: "temperature_2m,weather_code",
            daily: "weather_code,temperature_2m_max,temperature_2m_min",
            forecast_days: 7
        });

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" + params
        );

        if (!response.ok) {
            throw new Error("Could not retrieve weather data.");
        }

        return await response.json();

    }
    const $ = id => document.getElementById(id);

    let unit = "fahrenheit";
    let currentPlace = null;

    function temperature(value){
        return Math.round(value) +
            (unit === "fahrenheit" ? "°F" : "°C");
    }
    
    function renderWeather(place, data){
       $("cityName").textContent = place.name;

       $("condition").textContent =
        "Weather code: " + data.current.weather_code;

        $("temperature").textContent =
            temperature(data.current.temperature_2m);
        
        $("feelsLike").textContent =
            "Feels like: " +
            temperature(data.current.apparent_temperature);
        
        $("humidity").textContent =
            "Humidity: " +
            data.current.relative_humidity_2m + "%"
        
        $("wind").textContent =
            "Wind: " + Math.round(data.current.wind_speed_10m) +
            (unit === "fahrenheit" ? " mph" : " km/h")
        
        $("highLow").textContent =
            "High: " +
            temperature(data.daily.temperature_2m_max[0]) +
            " | Low: " +
            temperature(data.daily.temperature_2min[0]) +
        $("weather").hidden = false;
        $("status").textContent = "";
     }
     async function loadWeather(name){
        $("status").textContent = "Loading weather...";
        $("weather").hidden = true;

        try {
            const place = await searchCity(name);
            const data = await getWeather(place);

            currentPlace = place;
            renderWeather(place, data);
        } catch (error) {
            $("status").textContent =
            error.message || "Something went wrong."
        }
     }

    $("searchForm").addEventListener("submit", event => { event.preventDefault();
        const city= $("cityInput").value.trim();

        if (city) {
            loadWeather(city);
        }
    });

    $("unitButton").addEventListener("click", async() => {
        unit = unit === "fahrenheit" ? "celsius" : "fahrenheit";

     $("unitButton").textContent =
        unit === "fahrenheit" ? "°F / °C": "°C / °F";
        
    if (currentPlace) {
        $("status").textContent = "Updating units...";

        try {
            const data = await getWeather(currentPlace);
            renderWeather(currentPlace, data);
        }catch(error){
            $("status").textContent = error.message;
        }
    
    }
    });
</script> 
</body>
